# Push to main → deploy Firestore rules + Hosting.
# Required repo secret: FIREBASE_TOKEN (from `npx firebase-tools login:ci`)
name: Deploy Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules and Hosting
        run: firebase deploy --only firestore:rules,hosting --project badminton-app-b08cc --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
