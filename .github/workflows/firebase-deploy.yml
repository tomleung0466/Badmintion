# Push to main → deploy Firestore rules + Hosting.
# Required repo secret: FIREBASE_TOKEN (from `npx firebase-tools login:ci`)
name: Deploy Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check FIREBASE_TOKEN secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::GitHub Secret FIREBASE_TOKEN 未設定。請在本機執行 npx firebase-tools login:ci，把 token 加到 Repo → Settings → Secrets → Actions。"
            exit 1
          fi
          echo "FIREBASE_TOKEN is set."

      - name: Deploy Firestore rules, Storage rules, and Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools@15.20.0 deploy --only firestore:rules,storage,hosting --project badminton-app-b08cc --non-interactive --token "$FIREBASE_TOKEN"
