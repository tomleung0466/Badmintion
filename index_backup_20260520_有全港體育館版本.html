<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港羽聯 - 搵波打</title>
    <!-- 引入美化畫面的工具 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen flex justify-center text-gray-900 font-sans">

    <!-- 手機寬度容器 (Uber 極簡風格) -->
    <div class="w-full max-w-md bg-white shadow-xl min-h-screen relative flex flex-col border-x border-gray-100">
        
        <!-- ==================== 頁面 1：搵波打 ==================== -->
        <div id="page-match" class="flex-1 p-5 pb-24">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2">港羽聯 - 搵波打</h1>
            <p class="text-xs text-gray-400 mb-6">Uber 風格羽毛球同好會</p>

            <!-- 地區篩選 (模擬高級滾筒選擇器按鈕) -->
            <button onclick="toggleScrollPicker(true)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-left text-sm font-medium flex justify-between items-center mb-6 shadow-sm">
                <span id="current-region-text">📍 全港地區 (滾動選擇)</span>
                <span class="text-gray-400">▼</span>
            </button>

            <!-- 活動列表 -->
            <div id="matches-list" class="space-y-4">
                <!-- 資料會由 JavaScript 自動生成 -->
            </div>

            <!-- 懸浮發佈按鈕 (+) -->
            <button onclick="toggleBottomSheet(true)" class="fixed bottom-24 right-6 bg-black text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl font-light hover:scale-105 active:scale-95 transition-transform z-40">
                ＋
            </button>
        </div>

        <!-- ==================== 頁面 2：二手交易 ==================== -->
        <div id="page-market" class="hidden flex-1 p-5 pb-24">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight mb-1">用品交易</h1>
                    <p class="text-xs text-gray-400">球友二手市集</p>
                </div>
                <button onclick="alert('發佈用品功能開發中！')" class="bg-black text-white text-xs font-bold px-4 py-2 rounded-full shadow">
                    + 賣野
                </button>
            </div>
            
            <!-- 商品網格 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 shadow-sm">
                    <div class="w-full h-28 bg-gray-200 rounded-lg mb-2 flex items-center justify-center text-gray-400 text-xs">📷 拍面相片</div>
                    <h4 class="font-bold text-xs">Yonex Astrox 88D Pro</h4>
                    <p class="text-[10px] text-gray-400 my-1">新舊：95%新 (少瑕疵)</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs font-extrabold text-emerald-600">HK$ 850</span>
                        <span class="text-[9px] bg-gray-200 px-1.5 py-0.5 rounded text-gray-600">旺角交收</span>
                    </div>
                </div>
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 shadow-sm">
                    <div class="w-full h-28 bg-gray-200 rounded-lg mb-2 flex items-center justify-center text-gray-400 text-xs">📷 鞋面相片</div>
                    <h4 class="font-bold text-xs">Lining 羽毛球鞋 (Size 42)</h4>
                    <p class="text-[10px] text-gray-400 my-1">新舊：90%新 (只著過兩次)</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs font-extrabold text-emerald-600">HK$ 300</span>
                        <span class="text-[9px] bg-gray-200 px-1.5 py-0.5 rounded text-gray-600">沙田交收</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 頁面 3：搵教練 ==================== -->
        <div id="page-coach" class="hidden flex-1 p-5 pb-24">
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">搵教練</h1>
            <p class="text-xs text-gray-400 mb-6">星級導師專區</p>

            <div class="space-y-3">
                <!-- 教練 1 -->
                <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center font-bold text-sm shadow">陳Sir</div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-sm">陳大文 教練</h4>
                            <span class="text-xs text-amber-500">⭐ 5.0 (32)</span>
                        </div>
                        <p class="text-[11px] text-gray-400 mt-0.5">資歷：前香港青年隊代表 / 8年教學經驗</p>
                        <p class="text-[11px] text-gray-500 mt-1">📍 地區：九龍區、將軍澳</p>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-200/50">
                            <span class="text-xs font-extrabold text-gray-700">HK$ 350 / 小時</span>
                            <button onclick="alert('正在啟動 WhatsApp 聯絡教練...')" class="bg-emerald-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-full shadow">WhatsApp 預約</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

                    <button onclick="toggleScrollPicker(false)" class="text-sm text-gray-400">取消</button>
                    <span class="font-bold text-sm">選擇地區</span>
                    <button onclick="confirmPickerRegion()" class="text-sm font-bold text-emerald-600">完成</button>
                </div>
                <!-- 滾筒滾動區域 -->
                <div class="h-44 overflow-y-scroll snap-y snap-mandatory text-center py-16" id="picker-scroller">
                    <div class="snap-center h-10 flex items-center justify-center font-medium text-gray-400" data-val="all">全港地區</div>
                    <div class="snap-center h-10 flex items-center justify-center font-medium text-gray-400" data-val="觀塘區">觀塘區</div>
                    <div class="snap-center h-10 flex items-center justify-center font-medium text-gray-400" data-val="將軍澳">將軍澳</div>
                    <div class="snap-center h-10 flex items-center justify-center font-medium text-gray-400" data-val="沙田區">沙田區</div>
                    <div class="snap-center h-10 flex items-center justify-center font-medium text-gray-400" data-val="大埔區">大埔區</div>
                    <div class="snap-center h-10 flex items-center justify-center font-medium text-gray-400" data-val="荃灣區">荃灣區</div>
                    <div class="snap-center h-10 flex items-center justify-center font-medium text-gray-400" data-val="灣仔區">灣仔區</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ==================== 核心智慧邏輯 (JavaScript) ==================== -->
    <script>
        // 預設模擬數據 (包含評分與 2+2)
        let defaultMatches = [
            { id: 1, region: "觀塘區", venue: "藍田體育館", courts: 2, hours: 2, fee: 50, hostRating: "4.9", contact: "阿明 91234567", joined: false },
            { id: 2, region: "沙田區", venue: "源禾路體育館", courts: 1, hours: 2, fee: 45, hostRating: "4.7", contact: "Chris 61234567", joined: false }
        ];

        let matches = JSON.parse(localStorage.getItem('uber_badminton_matches')) || defaultMatches;
        let currentFilter = 'all';

        // 渲染搵波打列表
        function renderMatches() {
            const listContainer = document.getElementById('matches-list');
            listContainer.innerHTML = '';
            const filtered = currentFilter === 'all' ? matches : matches.filter(m => m.region === currentFilter);

            if(filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">該區域暫時沒有開場。</div>`;
                return;
            }

            filtered.forEach(match => {
                const card = document.createElement('div');
                card.className = "bg-gray-50 rounded-2xl p-5 border border-gray-100 shadow-sm flex flex-col justify-between relative";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="bg-gray-200 text-gray-700 text-[10px] px-2.5 py-0.5 rounded-full font-bold">${match.region}</span>
                            <h4 class="text-base font-bold text-gray-900 mt-2">${match.venue}</h4>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-extrabold text-gray-900">HK$ ${match.fee}</span>
                            <p class="text-[10px] text-amber-500 font-bold mt-1">⭐ ${match.hostRating}</p>
                        </div>
                    </div>
                    
                    <!-- 2+2 靈魂術語顯示 -->
                    <div class="my-3 bg-white border border-gray-100 rounded-xl p-3 flex justify-around text-center shadow-2xs">
                        <div>
                            <p class="text-[10px] text-gray-400">規格</p>
                            <p class="text-sm font-extrabold text-black mt-0.5">${match.courts} + ${match.hours}</p>
                        </div>
                        <div class="w-px bg-gray-100"></div>
                        <div>
                            <p class="text-[10px] text-gray-400">詳情</p>
                            <p class="text-[11px] font-medium text-gray-600 mt-0.5">${match.courts}個場 / ${match.hours}小時</p>
                        </div>
                    </div>

                    <p class="text-[11px] text-gray-400 mb-4">📞 聯絡場主：${match.contact}</p>

                    <div class="flex gap-2">
                        <button onclick="bookMatch(${match.id}, this)" class="flex-1 ${match.joined ? 'bg-gray-200 text-gray-400':'bg-black text-white'} font-bold py-2.5 rounded-xl text-xs transition shadow-sm">
                            ${match.joined ? '✓ 已預留學位' : '確認留位'}
                        </button>
                        ${match.joined ? `<button onclick="rateHost(${match.id})" class="bg-amber-500 text-white font-bold px-3 py-2.5 rounded-xl text-xs shadow-sm">⭐ 評分</button>` : ''}
                    </div>
                `;
                listContainer.appendChild(card);
            });
            localStorage.setItem('uber_badminton_matches', JSON.stringify(matches));
        }

        // 預留位置功能 (帶有流暢動畫效果)
        function bookMatch(id, btn) {
            const match = matches.find(m => m.id === id);
            if (match && !match.joined) {
                btn.innerHTML = "正在向場主申請...";
                setTimeout(() => {
                    match.joined = true;
                    alert(`🎉 成功預留位置！\n請即聯絡場主：${match.contact}\n活動結束後記得給予場主評分。`);
                    renderMatches();
                }, 800);
            }
        }

        // 模擬五星評分制度
        function rateHost(id) {
            let stars = prompt("請為本次活動及場主評分（請輸入 1 至 5 粒星）：", "5");
            if (stars >= 1 && stars <= 5) {
                alert(`感謝你的 ${stars} 星評價！雙向評分已記錄。如有惡意缺席者，系統將自動加入黑名單。`);
            } else if (stars !== null) {
                alert("請輸入正確的 1 至 5 數字。");
            }
        }

        // 處理新場地發佈表格
        function handleFormSubmit(event) {
            event.preventDefault();
            const venueSelect = document.getElementById('form-venue');
            const venueNoteInput = document.getElementById('form-venue-note');
            const isPrivateVenue = venueSelect.value === '__private_other__';
            const finalVenue = isPrivateVenue
                ? venueNoteInput.value.trim()
                : venueSelect.value;

            if (isPrivateVenue && !finalVenue) {
                alert('請填寫「備註 / 具體地點」');
                venueNoteInput.focus();
                return;
            }

            const newMatch = {
                id: Date.now(),
                region: document.getElementById('form-region').value,
                venue: finalVenue,
                courts: parseInt(document.getElementById('form-courts').value) || 1,
                hours: parseInt(document.getElementById('form-hours').value) || 2,
                fee: parseInt(document.getElementById('form-fee').value) || 50,
                hostRating: "5.0", // 新場主預設滿分
                contact: document.getElementById('form-contact').value,
                joined: false
            };
            matches.unshift(newMatch);
            toggleBottomSheet(false);
            event.target.reset();
            handleVenueSelectionChange();
            renderMatches();
        }

        // 分頁切換邏輯
        function switchPage(pageId) {
            ['match', 'market', 'coach'].forEach(p => {
                document.getElementById(`page-${p}`).classList.add('hidden');
                document.getElementById(`nav-${p}`).classList.remove('text-black');
            });
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            document.getElementById(`nav-${pageId}`).classList.add('text-black');
        }

        // 底部面板顯示開關
        function toggleBottomSheet(show) {
            document.getElementById('bottom-sheet').classList.toggle('hidden', !show);
        }

        function handleVenueSelectionChange() {
            const venueSelect = document.getElementById('form-venue');
            const venueNoteWrap = document.getElementById('venue-note-wrap');
            const venueNoteInput = document.getElementById('form-venue-note');
            const isPrivateVenue = venueSelect.value === '__private_other__';

            venueNoteWrap.classList.toggle('hidden', !isPrivateVenue);
            venueNoteInput.required = isPrivateVenue;

            if (!isPrivateVenue) {
                venueNoteInput.value = '';
            }
        }

        // 滾筒選擇器顯示開關
        function toggleScrollPicker(show) {
            document.getElementById('scroll-picker').classList.toggle('hidden', !show);
            if(show) {
                // 模擬高亮中間選中的項目
                const divs = document.querySelectorAll('#picker-scroller div');
                document.getElementById('picker-scroller').addEventListener('scroll', () => {
                    divs.forEach(d => d.classList.add('text-gray-400'));
                    // 簡化模擬：滾動時讓文字有點變化
                });
            }
        }

        // 確認滾筒選中的地區
        function confirmPickerRegion() {
            // 這裡做一個精簡的模擬選擇（實際 App 中會偵測滾到哪裡）
            const regions = ['all', '觀塘區', '將軍澳', '沙田區', '大埔區', '荃灣區', '灣仔區'];
            // 隨機或根據預設模擬選擇
            let selected = document.getElementById('form-region').value; // 借用發佈表格的選值做模擬
            currentFilter = selected;
            document.getElementById('current-region-text').innerHTML = `📍 地區：${selected}`;
            toggleScrollPicker(false);
            renderMatches();
        }

        // 初始化第一次執行
        document.getElementById('form-venue').addEventListener('change', handleVenueSelectionChange);
        renderMatches();
    </script>
</body>
</html>
